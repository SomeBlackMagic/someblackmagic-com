name = "someblackmagic-com"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Generates src/posts-data.ts and icons before bundling. Runs on every
# wrangler deploy / versions upload / dev, including Cloudflare Workers Builds,
# which call wrangler directly without `npm run build`.
[build]
command = "npm run build"
watch_dir = ["content", "scripts", "src/categories.ts", "src/index.ts", "src/locales.ts", "src/template.ts", "public/favicon.svg"]

[assets]
directory = "./public"

# Giscus comments (https://giscus.app). These ids are public — they end up in page HTML anyway.
# Comments are hidden if any of them is missing.
[vars]
GISCUS_REPO = "SomeBlackMagic/someblackmagic-com"
GISCUS_REPO_ID = "R_kgDOUJ8TAw"
GISCUS_CATEGORY = "General"
GISCUS_CATEGORY_ID = "DIC_kwDOUJ8TA84DElv2"

[observability]
enabled = true
